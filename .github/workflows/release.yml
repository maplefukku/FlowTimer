name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version tag (e.g., v1.0.0)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode Project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild \
            -project FlowTimer.xcodeproj \
            -scheme FlowTimer \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="-" \
            DEVELOPMENT_TEAM="" \
            clean build

      - name: Prepare App Bundle
        run: |
          mkdir -p build/release
          cp -R build/DerivedData/Build/Products/Release/FlowTimer.app build/release/

      - name: Get Version
        id: version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> $GITHUB_OUTPUT
          else
            echo "version=${GITHUB_REF_NAME}" >> $GITHUB_OUTPUT
          fi

      - name: Create DMG
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Install create-dmg for prettier DMGs
          brew install create-dmg || true

          TEMP_DIR=$(mktemp -d)
          DMG_STAGING="${TEMP_DIR}/FlowTimer"
          mkdir -p "${DMG_STAGING}"
          cp -R build/release/FlowTimer.app "${DMG_STAGING}/"
          ln -s /Applications "${DMG_STAGING}/Applications"

          hdiutil create \
            -volname "FlowTimer" \
            -srcfolder "${DMG_STAGING}" \
            -ov \
            -format UDZO \
            "build/FlowTimer-${VERSION}.dmg"

          rm -rf "${TEMP_DIR}"

      - name: Create ZIP Archive
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          cd build/release
          zip -r "../FlowTimer-${VERSION}.zip" FlowTimer.app
          cd ../..

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FlowTimer-${{ steps.version.outputs.version }}
          path: |
            build/FlowTimer-*.dmg
            build/FlowTimer-*.zip

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: FlowTimer ${{ steps.version.outputs.version }}
          body: |
            ## FlowTimer ${{ steps.version.outputs.version }}

            ### Installation

            1. Download `FlowTimer-${{ steps.version.outputs.version }}.dmg`
            2. Open the DMG file
            3. Drag FlowTimer to your Applications folder
            4. Launch FlowTimer from Applications

            > **Note**: Since this build is not notarized, you may need to right-click → Open on first launch.

            ### What's New

            See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) for details.
          files: |
            build/FlowTimer-*.dmg
            build/FlowTimer-*.zip
          draft: false
          prerelease: false
