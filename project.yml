name: FlowTimer
options:
  bundleIdPrefix: com.flowtimer
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "16.0"
  generateEmptyDirectories: true
  groupSortPosition: top

settings:
  base:
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.10"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    GENERATE_INFOPLIST_FILE: false

targets:
  FlowTimer:
    type: application
    platform: macOS
    sources:
      - path: FlowTimer
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.flowtimer.app
        INFOPLIST_FILE: FlowTimer/Info.plist
        CODE_SIGN_ENTITLEMENTS: FlowTimer/FlowTimer.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: true
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/../Frameworks"
        ENABLE_HARDENED_RUNTIME: true
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_NAME: FlowTimer
        SWIFT_EMIT_LOC_STRINGS: true
    info:
      path: FlowTimer/Info.plist
    entitlements:
      path: FlowTimer/FlowTimer.entitlements
